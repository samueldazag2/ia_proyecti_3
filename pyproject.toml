[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clasificacion-adult"
version = "1.0.0"
description = "Clasificación del dataset Adult (UCI) con redes neuronales feed-forward"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Samuel Daza" }, { name = "Nicolás Parra" },
  { name = "Thomas López" }, { name = "Samuel Velandia" },
]
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
notebook = ["jupyter>=1.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.10", "pandas-stubs"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
# N803/N806 no se activan: X / X_train es la convención de scikit-learn.
ignore = ["RUF001", "RUF002", "RUF003"]  # caracteres como "×", "–" y "·" son intencionales en español

[tool.ruff.lint.isort]
known-first-party = ["clasificacion_adult"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
